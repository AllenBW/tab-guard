name: Release Build (Draft)

# Pushing a tag like v1.0.1 builds a universal (Apple silicon + Intel) app, signs and notarizes
# it, and creates a DRAFT release with the DMG and the update files. Installed copies only see
# an update once the draft is published, so smoke-test the DMG first. See RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.1). Must already exist on origin.'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # Not macos-latest: binaries linked against an older SDK can show a blank window on
    # macOS 26.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Check the version and changelog match the tag
        id: notes
        run: |
          VERSION="${TAG#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$CONF" != "$VERSION" ]; then
            echo "::error::tauri.conf.json says $CONF but the tag is $TAG"; exit 1
          fi
          # The changelog section for this version becomes the release notes.
          awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No '## $VERSION' section in CHANGELOG.md"; exit 1
          fi
          {
            echo "body<<NOTES_EOF"
            cat notes.md
            echo
            echo "**Install:** download **Install-Tab-Guard.dmg** (the first file below), open it, and drag Tab Guard to Applications. latest.json is for Tab Guard's automatic updater and the source archives are GitHub's; you don't need them."
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build, sign, notarize and create the draft release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: 'Tab Guard __VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - name: Notarize and staple the disk image
        # tauri-action notarizes and staples the app but only signs the disk image around it.
        # Gatekeeper assesses the image too when a download is opened, so notarize it as well and
        # replace the copy tauri-action already uploaded to the draft.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" -print -quit)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"
          # Replace the copy tauri-action uploaded (GitHub names assets with dots for spaces) with one
          # named for the person installing. The name carries no version so the page's download link,
          # releases/latest/download/Install-Tab-Guard.dmg, never changes.
          gh release delete-asset "$TAG" "$(basename "$DMG" | tr " " .)" --yes
          cp "$DMG" "$RUNNER_TEMP/Install-Tab-Guard.dmg"
          gh release upload "$TAG" "$RUNNER_TEMP/Install-Tab-Guard.dmg" --clobber

      - name: Park the updater files on the Updater files release
        # The app's update check reads latest.json from the latest release and downloads the archive
        # it names from wherever that points. The archive and its signature go on the "updates"
        # pre-release (never the latest release), so a version's release lists the installer and
        # latest.json only.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          ARCHIVE=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app.tar.gz" -print -quit)
          PARKED="Tab-Guard-${VERSION}-universal.app.tar.gz"
          cp "$ARCHIVE" "$RUNNER_TEMP/$PARKED"
          cp "$ARCHIVE.sig" "$RUNNER_TEMP/$PARKED.sig"
          gh release upload updates "$RUNNER_TEMP/$PARKED" "$RUNNER_TEMP/$PARKED.sig" --clobber
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP/manifest" --clobber
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/updates/$PARKED"
          jq --arg url "$URL" '.platforms |= with_entries(.value.url = $url)' "$RUNNER_TEMP/manifest/latest.json" > "$RUNNER_TEMP/latest.json"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".app.tar.gz") or endswith(".app.tar.gz.sig"))'); do
            gh release delete-asset "$TAG" "$asset" --yes
          done

      - name: Clean up the keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          [ -f "$KEYCHAIN_PATH" ] && security delete-keychain "$KEYCHAIN_PATH" || true
