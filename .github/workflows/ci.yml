name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR replaces the run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS is needed: the sampler reads processes through libproc, and the UI tests run the window
    # in WebKit. The repo is public, so GitHub-hosted runners (macOS included) cost no Actions minutes.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The window in WebKit, against the fake backend (tests/ui).
      - run: pnpm exec playwright install webkit
      - run: pnpm test:ui
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: ui-test-results
          path: test-results/
