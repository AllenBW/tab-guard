[package]
name = "tab-guard"
version = "0.1.0"
description = "Menu-bar watchdog that keeps Firefox tabs from eating the Mac's memory"
edition = "2021"
publish = false

[lib]
name = "tab_guard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
